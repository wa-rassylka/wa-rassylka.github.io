<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Промпттар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="mark">JUZ40</span><span class="name">Сертификат</span></div>
    <nav class="nav"><a href="index.html">Редактор</a><a href="ulgiler.html" class="on">Промпттар</a></nav>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="wrap">
      <div class="preview">
        <img id="exImg" alt="Үлгі">
        <div class="btns">
          <button class="btn" id="copyImg">⧉ Үлгіні көшіру</button>
          <a class="btn" id="dlImg" download>⬇ Үлгіні жүктеу</a>
        </div>
      </div>
      <div class="panel">
        <div class="box">
          <h2 class="title" id="exTitle"></h2>
          <div class="note" id="exDesc"></div>
          <div class="seg" id="gender">
            <button data-g="boy">Ұл бала</button>
            <button data-g="girl">Қыз бала</button>
          </div>
          <div class="seg" id="hair">
            <button data-h="keep">Шаш: үлгідегідей</button>
            <button data-h="own">Шаш: оқушыныкі</button>
          </div>
        </div>
        <div class="box">
          <h2>Мәтіндер</h2>
                    <div class="fields" id="fields"></div>
        </div>
        <div class="box">
          <h2>Промпт</h2>
          <textarea id="prompt" rows="14"></textarea>
          <div class="btns">
            <button class="btn primary" id="copyPrompt">⧉ Промптты көшіру</button>
            <button class="btn" id="openGemini">Gemini ашу ↗</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const EXAMPLES = [
  { id:'ex1', title:'Absolute үздік', g:'boy', ratio:'2:3 portrait',
    desc:'Қара студия, сұр кресло, қара костюм, қолдарын көтеріп отыр.',
    note:'Keep the dark studio background, the grey armchair, the black suit with black shirt and tie, the crossed-legs seated pose with both hands raised, the small JUZ40 logo at the top-left and the big bold white title at the bottom with a thin line between the two text lines.',
    fields:[{l:'Үстіңгі жазу',t:'ABSOLUTE'},{l:'Үлкен жазу',t:'ҮЗДІК'}] },
  { id:'ex2', style:'illustration', title:'Ретро-қала, күн бату', g:'girl', ratio:'16:9 landscape',
    desc:'Пальмалар, күлгін-қызғылт күн бату, ретро көлік, иллюстрация стилі.',
    note:'Keep the stylized 80s retro illustration look: purple-pink-orange sunset sky, palm tree silhouettes, pastel art-deco buildings, the classic silver muscle car with the student sitting on its hood, the white inverted-triangle title frame at the top with bold condensed white letters, and the "JUZ40 EdTech" logo with lines at the bottom center. The person must be drawn in the same illustrated style as the rest of the poster.',
    fields:[{l:'Аты-жөні (1-жол)',t:'КЕРЕЕВА'},{l:'Аты-жөні (2-жол)',t:'АЙЫМ'},{l:'Астындағы жазу',t:'3.3 АПТА ҮЗДІГІ'}] },
  { id:'ex3', title:'Маңызды күнді ұмытпа', g:'boy', ratio:'2:3 portrait',
    desc:'Қараңғы үстел, полароид фото, құлыпты қорап, жазбалар, шам жарығы.',
    note:'Keep the dark cinematic desk scene with the warm desk lamp, the pinned paper note with the handwritten red-circled date and checklist, the black box with the glowing combination lock, the envelope, notebook, pen, mug, books and laptop. Put the student into the Polaroid photo on the left (same pose: hand under chin, dark suit). The combination lock digits must show the same date as the note. Keep all small decorative English texts as they are.',
    fields:[{l:'Үлкен тақырып',t:'МАҢЫЗДЫ КҮНДІ ҰМЫТПА'},{l:'Күні',t:'29.09'},{l:'Пән',t:'ИНФОРМАТИКА'},{l:'Полароид астындағы жазу',t:'Бір қадам үлкен нәтижеге!'}] },
  { id:'ex4', hair:'two high pigtails with bangs, black hair with red and blue dyed tips', title:'Ойын картасы', g:'girl', ratio:'4:5 portrait',
    desc:'Карта масттары фоны, ақ карта, клоун/джокер бейнесі, қолжазба тақырып.',
    note:'Keep the dark background pattern of red and grey card suits (hearts, spades, clubs, diamonds), the cream-white playing card in the center with the folded corner and thin black frame, the burgundy handwritten script title, the two cartoon jester figures (top-left and bottom-right), the bold black name with the small black jester hat icon, and the thin bottom line with small labels. The student wears the same jester-inspired look: red-and-blue leather jacket, playful red-blue makeup around the eyes.',
    fields:[{l:'Тақырып',t:'2 best results'},{l:'Аты-жөні',t:'Ermakhan Gulden'},{l:'Төменгі сол жақ',t:'TARIKH'},{l:'Төменгі оң жақ',t:'TEAM'}] },
  { id:'ex5', hair:'tight cornrow braids pulled straight back', title:'Көшпенділер эпосы', g:'boy', ratio:'4:5 portrait',
    desc:'Тарихи фильм постері: сол жақ — жылы шөл, оң жақ — суық тұман, батырлар.',
    note:'Keep the epic historical Kazakh nomad movie-poster look: the student in the center close-up wearing a dark embroidered traditional robe with turquoise and amber bead necklace, the warm golden desert side with warriors, yurts and caravans on the left, the cold misty blue side with dark warriors on the right, the large runic-style title between two horizontal lines, the gold rating text block at the bottom with the big number in the middle, and the small logos in the corners. Keep the runic title and corner runes exactly as in the reference.',
    fields:[{l:'Аты-жөні (латынша)',t:'Kenzhebay Alikhan'},{l:'Сол жақ жазу',t:'ЖАЛПЫ РЕЙТИНГ БОЙЫНША'},{l:'Ортадағы сан',t:'1'},{l:'Оң жақ жазу',t:'3-АЙ 3-АПТА ҮЗДІГІ'}] },
  { id:'ex6', title:'Ақ студия, TOP', g:'boy', ratio:'1:1 square',
    desc:'Ақ фон, смокинг, алтын түсті үлкен TOP және балл.',
    note:'Keep the clean white studio background, the standing pose adjusting the bow tie, black tuxedo with white shirt, the gold name text in the top-right, the two rounded pill labels (grey-blue and dark navy), the big gold gradient "TOP" text and score, and the thin bottom line with a small label on the left.',
    fields:[{l:'Аты-жөні',t:'ШАПАРХАНОВ ЕСКЕНДИР'},{l:'1-белгі',t:'1-ай 2-апта РТ'},{l:'2-белгі (пән)',t:'ФИЗИКА'},{l:'Орны',t:'TOP 5'},{l:'Балл',t:'188.5/195'},{l:'Төменгі жазу',t:'БАЛКА'}] },
  { id:'ex7', title:'Чемпион', g:'boy', ratio:'3:4 portrait',
    desc:'Қызыл түтін, прожекторлар, чемпион белдігі, алтын TOP-1.',
    note:'Keep the dark red smoky arena background with spotlights, the big gold "TOP-1" title, the "WEEK … STUDENT CHAMPION" lines, the gold-framed photo of the student as a champion fighter in a black-and-gold team jacket holding a big gold championship belt (use a generic champion belt and jacket without any real brand logos), the dark red certificate panel with white text, and the bottom section with the signature on the left and the score list on the right.',
    fields:[{l:'Апта',t:'WEEK 4.4'},{l:'Аты-жөні',t:'АМАНЖОЛ АРСЕН'},{l:'Сипаттама',t:'ТАРИХ пәні бойынша 4-АЙ 4-АПТА жоғары нәтиже көрсетіп, үздіктер қатарында болып, ТОП-1 атанғаны үшін'},{l:'Кімнен',t:'Марха апайдан'},{l:'Балдар',t:'FULL / ПС 60/60 / КУИЗ 20/20 / ЖЖ 25/25 / СТ 14/15'}] },
  { id:'ex8', title:'Жаңа жыл', g:'boy', ratio:'3:4 portrait',
    desc:'Шырша, жылы жарық, Аяз Ата костюміндегі жасыл мультфильм кейіпкері.',
    note:'Keep the warm cozy Christmas scene: decorated Christmas tree with golden bokeh lights, the student in a dark coat with a red-green knitted holiday scarf, the furry green holiday creature in a red Santa suit standing next to the student holding a red ornament, the thin red frame, the small JUZ40 logo at the top, the white handwritten script name, the dark rounded label with bold white text, and the thin bottom line with a small signature text on the left.',
    fields:[{l:'Аты-жөні',t:'Турсунбой Рустам'},{l:'Белгідегі жазу',t:'2-АЙ 3-АПТА ҮЗДІГІ'},{l:'Төменгі жазу',t:'Диля апайдың'}] },
];

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('ulgi_'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('ulgi_'+k, JSON.stringify(v)); }catch(e){} },
};
let cur = EXAMPLES.find(e=>e.id===store.get('cur')) || EXAMPLES[0];
let gender = cur.g;
let hairMode = cur.hair ? 'keep' : 'own';
const values = {}; // per example: array of texts

const $ = id => document.getElementById(id);
const promptEl = $('prompt');

function buildPrompt(){
  const who = gender==='girl' ? 'teenage girl' : 'teenage boy';
  const vals = values[cur.id];
  const changes = cur.fields.map((f,i)=>({from:f.t, to:(vals[i]??f.t).trim()}));
  const changed = changes.filter(c=>c.to && c.to!==c.from);
  const kept = changes.filter(c=>!c.to || c.to===c.from);
  const g2 = cur.g==='girl'?'girl':'boy', g1 = gender==='girl'?'girl':'boy';
  const genderLine = gender===cur.g ? '' :
    `\n   The person in Image 2 is a ${g2}, but the student is a ${g1}: keep the same outfit, pose, hands and colors, and only adjust the face and body shape naturally so it looks like a ${g1}.`;
  const hairLine = hairMode==='keep'
    ? `HAIR: keep the hairstyle from Image 2 exactly as it is${cur.hair?` (${cur.hair})`:''} — same shape, length, color and parting. Only the face changes.`
    : `HAIR: use the student's own hairstyle and hair color from Image 1, styled neatly to fit the poster.`;
  const faceStyle = cur.style==='illustration'
    ? 'Draw the student\'s face in the same illustrated style as the rest of the poster, but clearly recognizable.'
    : 'Match the lighting, angle, skin texture and expression of the original so it looks like a real photo, not a pasted face.';

  let txt = `I am attaching 2 images:
• Image 1 — a photo of the student (a ${who}).
• Image 2 — the finished poster (the reference).

TASK: EDIT Image 2. Use Image 2 as the base image and keep it identical — the same composition, framing, crop, camera angle, pose, hands, clothing, background, lighting, colors, grain, typography, logos and every decorative element. Do NOT redesign, restyle, move, add or remove anything.

Change ONLY these things:

1. FACE: replace the face of the person in Image 2 with the face of the student from Image 1 — exactly the same identity, facial features, face shape, eyes, nose, lips, eyebrows, skin tone, and glasses if the student wears them. ${faceStyle}${genderLine}

2. ${hairLine}

3. TEXT:`;
  if (changed.length){
    txt += ' replace these texts exactly (same font style, size, color and position; Kazakh letters Ә Ғ Қ Ң Ө Ұ Ү Һ І must be spelled correctly):\n';
    changed.forEach(c=>{ txt += `   • "${c.from}" → "${c.to}"\n`; });
    if (kept.length) txt += `   Keep all other texts exactly as in Image 2.\n`;
  } else {
    txt += ' keep all texts exactly as in Image 2.\n';
  }
  txt += `
Details of Image 2 that must stay unchanged: ${cur.note}

Output: one image with exactly the same size and aspect ratio as Image 2 (${cur.ratio}), high quality and sharp. Everything except the face${hairMode==='keep'?'':', hair'} and the listed texts must look exactly like Image 2. No extra text, watermarks or logos.`;
  return txt;
}
function refresh(){ promptEl.value = buildPrompt(); }

function select(ex){
  cur = ex; store.set('cur', ex.id);
  gender = store.get('g_'+ex.id) || ex.g;
  hairMode = store.get('h_'+ex.id) || (ex.hair ? 'keep' : 'own');
  document.querySelectorAll('#hair button').forEach(b=>b.classList.toggle('on', b.dataset.h===hairMode));
  if (!values[ex.id]) values[ex.id] = store.get('v_'+ex.id) || ex.fields.map(f=>f.t);
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on', c.dataset.id===ex.id));
  $('exImg').src = `examples/${ex.id}.jpg`;
  $('dlImg').href = `examples/${ex.id}.jpg`;
  $('dlImg').download = `Үлгі - ${ex.title}.jpg`;
  $('exTitle').textContent = ex.title;
  $('exDesc').textContent = ex.desc;
  document.querySelectorAll('#gender button').forEach(b=>b.classList.toggle('on', b.dataset.g===gender));
  const box = $('fields'); box.innerHTML='';
  ex.fields.forEach((f,i)=>{
    const lab = document.createElement('label');
    if (f.t.length > 28) lab.className='wide';
    lab.textContent = f.l;
    const inp = document.createElement(f.t.length > 40 ? 'textarea' : 'input');
    if (inp.tagName==='INPUT') inp.type='text'; else inp.rows=3;
    inp.value = values[ex.id][i];
    inp.addEventListener('input', ()=>{ values[ex.id][i]=inp.value; store.set('v_'+ex.id, values[ex.id]); refresh(); });
    lab.appendChild(inp); box.appendChild(lab);
  });
  refresh();
}

const list = $('list');
EXAMPLES.forEach(ex=>{
  const b = document.createElement('button');
  b.className='card'; b.dataset.id=ex.id;
  b.innerHTML = `<img src="examples/${ex.id}.jpg" alt="" loading="lazy">`;
  b.onclick = ()=>{ select(ex); if (window.innerWidth<760) $('exImg').scrollIntoView({behavior:'smooth'}); };
  list.appendChild(b);
});

document.querySelectorAll('#hair button').forEach(b=>b.onclick=()=>{
  hairMode=b.dataset.h; store.set('h_'+cur.id, hairMode);
  document.querySelectorAll('#hair button').forEach(x=>x.classList.toggle('on',x===b)); refresh();
});
document.querySelectorAll('#gender button').forEach(b=>b.onclick=()=>{
  gender=b.dataset.g; store.set('g_'+cur.id, gender);
  document.querySelectorAll('#gender button').forEach(x=>x.classList.toggle('on',x===b)); refresh();
});

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ promptEl.select(); return document.execCommand('copy'); }
}
$('copyPrompt').onclick = async ()=>{ await copyText(promptEl.value); toast('Промпт көшірілді ✓'); };
$('openGemini').onclick = async ()=>{ await copyText(promptEl.value); window.open('https://gemini.google.com/app','_blank','noopener'); toast('Промпт көшірілді — фото мен үлгіні тіркеп, қойыңыз'); };

$('copyImg').onclick = async ()=>{
  try{
    const img = $('exImg');
    const c = document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    const blob = await new Promise(r=>c.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    toast('Үлгі көшірілді — Gemini-ге Cmd/Ctrl+V');
  }catch(e){ toast('Көшіру болмады — «Үлгіні жүктеу» батырмасын басыңыз'); }
};

let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }

select(cur);
</script>
</body>
</html>
