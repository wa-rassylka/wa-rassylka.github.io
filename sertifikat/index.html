<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="app">
  <aside>
    <div class="brand"><span class="mark">JUZ40</span><span class="name">Сертификат</span></div>
    <nav class="nav"><a href="index.html" class="on">Редактор</a><a href="ulgiler.html">Промпттар</a></nav>

    <details open>
      <summary><span class="n">1</span>Фон</summary>
      <div class="body">
        <div class="themes" id="themes"></div>
        <div class="divider"></div>
        <div class="themes scroll" id="themesFig"></div>
        <div class="btns">
          <button class="btn" id="uploadBtn">⬆ Өз суретің</button>
          <button class="btn" id="resetBg">↺ Қайтару</button>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </details>

    <details open>

        <div class="seg" id="gender">
          <button data-g="boy" class="on">Ұл бала</button>

        <div class="btns">

        </label>
        <label>Лауазымы

        </label>

      <div class="body">

        <div class="rangeRow">Солға/оңға<input type="range" id="r_x" min="-60" max="40" value="0"><output id="o_x"></output></div>
        <div class="rangeRow">Жоғары/төмен<input type="range" id="r_y" min="-40" max="40" value="0"><output id="o_y"></output></div>
        <div class="rangeRow">Қараңғылық<input type="range" id="r_dark" min="0" max="100" value="100"><output id="o_dark"></output></div>

      <button class="btn big" id="dlJpg">⬇ JPG</button>
    </div>

</div>
<div class="toast" id="toast"></div>

<script>
const W = 1824, H = 1272;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const FONT_TITLE = '"Dune Rise", Michroma, Montserrat, sans-serif';
const FONT_BODY  = '"JUZ40 FONTS", Montserrat, sans-serif';
const FONT_SCRIPT= '"Disruptors Script", "Great Vibes", "Marck Script", "Bad Script", cursive';

const THEMES = [
  {id:'space',   t:'Ғарыш',            s:'as an astronaut in a white spacesuit with the helmet off, standing on a rocky alien planet, a gigantic ringed gas planet and a glowing orange-teal nebula in the sky'},
  {id:'pirates', t:'Теңіз қарақшылары',s:'as a young ship captain in a long dark coat standing on the bow of a huge old pirate ship with torn sails, stormy sea at golden sunset, seagulls'},
  {id:'samurai', t:'Самурай',          s:'as a young samurai in a dark kimono holding a katana under a giant blooming cherry blossom tree at dusk, pink petals in the wind, a red moon and distant mountains, anime film style'},
  {id:'forest',  t:'Сиқырлы орман',    s:'as a young explorer with a backpack and a glowing lantern walking into a magical night forest full of giant glowing mushrooms and fireflies, 3D animated movie style, warm cozy light'},
  {id:'neon',    t:'Неон қала',        s:'as a hero in a dark hooded coat standing on a rainy rooftop overlooking a futuristic neon megacity with flying cars and holograms, purple, magenta and cyan light'},
  {id:'ocean',   t:'Мұхит',            s:'sitting in a small wooden boat with a lantern on a calm night ocean while a giant glowing bioluminescent whale swims beneath, starry sky, painterly animated movie style'},
  {id:'dragon',  t:'Айдаһар',          s:'as a young dragon rider in a dark cloak standing on a cliff next to a huge dragon with glowing ember scales, an old stone castle behind, embers in the air'},
  {id:'desert',  t:'Шөл сапары',       s:'as an explorer in a wide-brimmed hat and leather jacket holding a torch at the entrance of an ancient golden temple carved into a canyon wall, dusty light beams'},
  {id:'winter',  t:'Қысқы патшалық',   s:'in a flowing blue winter cloak standing on a snowy hill in front of a sparkling ice palace under green and violet northern lights, magical animated movie style'},
  {id:'robot',   t:'Робот дос',        s:'sitting on a rooftop next to a small friendly round robot with big glowing eyes, both looking at a starry sky with a crescent moon, cozy city lights below, 3D animated movie style'},
  {id:'dino',    t:'Динозаврлар',      s:'as a young explorer in khaki clothes standing on a rock in a misty prehistoric jungle watching a giant long-necked dinosaur and a T-rex, waterfalls and a volcano behind'},
  {id:'hero',    t:'Суперқаһарман',    s:'as an original superhero in a sleek dark suit with a flowing red cape and no emblem, mask off, standing on top of a skyscraper at night, lightning in the clouds, city lights below'},
];

const DEFAULT_TEXT = {
  name:'Sauirbay Islam',
  desc:'7-ай 2-апта бойынша асқан білімпаздығымен көзге түсіп, жалпы рейтинг бойынша үздік нәтиже көрсетіп, **ГЕОГРАФИЯ** және **МАТЕМАТИКА** пәндерінен **ТОП-1** болғаны үшін марапатталады',
  badge:'SMART  |  2026',
  title:'CERTIFICATE',
  values:'Ниет, Адалдық, Жауапкершілік, Еңбекқорлық',
  left:'ASL',
  right:'GEOMATH',
  signer:'Мұсаева\nЖұлдызай\nДүйсенбайқызы',
  role:'JUZ40 білім беру орталығының\nнегізін қалаушысы',
};

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('sert_'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('sert_'+k, JSON.stringify(v)); }catch(e){} },
};

const state = {
  theme: store.get('theme') || 'space',
  gender: store.get('gender') || 'boy',
  text: Object.assign({}, DEFAULT_TEXT, store.get('text') || {}),
  adj: Object.assign({zoom:100,x:0,y:0,dark:100}, store.get('adj') || {}),
  img: null,          // HTMLImageElement in use
  custom: false,      // user-uploaded image
};
if (state.text.badge === "GENIUS  |  2026") state.text.badge = DEFAULT_TEXT.badge;

/* ---------- prompt ---------- */
let FIGMA = [];
function getTheme(id){ return THEMES.find(t=>t.id===id) || FIGMA.find(t=>t.id===id); }
function themeSrc(th){ return th.src || ('bg/'+th.id+'.jpg'); }
function buildPrompt(){
  const th = getTheme(state.theme) || THEMES[0];
  const who = state.gender==='girl' ? 'teenage girl' : 'teenage boy';
  const pos = state.gender==='girl' ? 'her' : 'his';
  if (th.figma) return `I am attaching 2 images:
• Image 1 — a photo of a ${who}.
• Image 2 — a background scene (the reference).

EDIT Image 2: keep the scene, composition, art style, colors and lighting exactly the same. If there is a main character in Image 2, replace that character's face with the face of the ${who} from Image 1 and keep the character's pose, clothing and hairstyle; if there is no character, add the ${who} on the right third of the frame in a pose that fits the scene.

The face must be exactly the same as in Image 1 — same identity, facial features, eyes, nose, lips, skin tone, and glasses if ${state.gender==='girl'?'she wears':'he wears'} them — and drawn in the same style as Image 2 so it looks natural. Keep the left half of the image dark and empty for text, exactly like Image 2.

Output: one image with the same size and aspect ratio as Image 2. No extra text, letters, logos or watermarks.`;
  return `Use the attached photo of a ${who}. Keep ${pos} face exactly the same — same identity, facial features, skin tone and hairstyle — so ${state.gender==='girl'?'she':'he'} is clearly recognizable.

Show the ${who} ${th.s}.

Cinematic movie still, wide 16:9 landscape format. The ${who} is on the right third of the frame, in a three-quarter view with the face clearly visible. The left half of the image must be dark, almost black, empty space for text. Rich film color grading, high detail. No text, no letters, no logos, no watermark.`;
}
const promptEl = document.getElementById('prompt');
function refreshPrompt(){ promptEl.value = buildPrompt(); }

/* ---------- images ---------- */
const cache = {};
function loadImg(src){
  if (cache[src]) return cache[src];
  cache[src] = new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  return cache[src];
}
async function useTheme(id){
  const th = getTheme(id) || THEMES[0]; id = th.id;
  state.theme=id; state.custom=false; store.set('theme',id);
  state.shade = th.shade ?? 1;
  state.img = await loadImg(themeSrc(th));
  document.querySelectorAll('.theme').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  const dlBg = document.getElementById('dlBg'); if (dlBg){ dlBg.href = themeSrc(th); dlBg.download = 'Фон - '+th.t+'.jpg'; }
  refreshPrompt(); draw();
}
function useFile(file){
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = () => { const i=new Image(); i.onload=()=>{ state.img=i; state.custom=true; draw(); toast('Сурет қойылды'); }; i.src=r.result; };
  r.readAsDataURL(file);
}

/* ---------- drawing helpers ---------- */
function spacedWidth(text, spacing){ let w=0; for (const ch of text) w += ctx.measureText(ch).width + spacing; return w - spacing; }
function drawSpaced(text, x, y, spacing, align='left'){
  const w = spacedWidth(text, spacing);
  let cx = align==='right' ? x - w : align==='center' ? x - w/2 : x;
  ctx.textAlign='left';
  for (const ch of text){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacing; }
  return w;
}
function hline(x1,x2,y,alpha=.85,w=1.6){ ctx.save(); ctx.strokeStyle=`rgba(255,255,255,${alpha})`; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke(); ctx.restore(); }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// rich text with **bold**
function wrapRich(src, maxW, size){
  const tokens=[]; let bold=false;
  src.split('**').forEach((part,i)=>{ if(i>0) bold=!bold; part.split(/(\s+)/).forEach(w=>{ if(w) tokens.push({w,bold}); }); });
  const lines=[[]]; let lw=0;
  for (const t of tokens){
    ctx.font = `${t.bold?800:400} ${size}px ${FONT_BODY}`;
    const tw = ctx.measureText(t.w).width;
    if (/^\s+$/.test(t.w)){ if (lines.at(-1).length){ lines.at(-1).push({...t,tw}); lw+=tw; } continue; }
    if (lw + tw > maxW && lines.at(-1).length){
      while (lines.at(-1).length && /^\s+$/.test(lines.at(-1).at(-1).w)) lines.at(-1).pop();
      lines.push([]); lw=0;
    }
    lines.at(-1).push({...t,tw}); lw+=tw;
  }
  return lines;
}

/* ---------- main draw ---------- */
function draw(){
  const T = state.text, A = state.adj;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

  // background image: height-fit, anchored right
  const img = state.img;
  if (img){
    const z = A.zoom/100;
    const h = H*z, w = img.naturalWidth/img.naturalHeight*h;
    const x = W - w + (A.x/100)*W;
    const y = (H - h)/2 + (A.y/100)*H;
    ctx.drawImage(img, x, y, w, h);
  }

  // shading (Figma backgrounds already contain their own shading)
  const d = (state.custom || state.shade !== 0) ? A.dark/100 : 0;
  if (d > 0){
  let g = ctx.createLinearGradient(0,0,W*0.85,0);
  g.addColorStop(0, `rgba(0,0,0,${0.97*d})`);
  g.addColorStop(0.42, `rgba(0,0,0,${0.85*d})`);
  g.addColorStop(0.68, `rgba(0,0,0,${0.3*d})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g = ctx.createLinearGradient(0,0,0,300);
  g.addColorStop(0,`rgba(0,0,0,${0.9*Math.max(d,.5)})`); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,300);
  g = ctx.createLinearGradient(0,H-430,0,H);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${0.92*Math.max(d,.5)})`);
  ctx.fillStyle=g; ctx.fillRect(0,H-430,W,430);
  }

  ctx.fillStyle='#fff'; ctx.textBaseline='alphabetic';

  // header
  ctx.font = `500 18px ${FONT_BODY}`;
  const lw = drawSpaced(T.left.toUpperCase(), 38, 78, 5.4, 'left');
  const rw = drawSpaced(T.right.toUpperCase(), 1732, 78, 5.4, 'right');
  ctx.font = `800 40px ${FONT_BODY}`;
  drawSpaced('JUZ40', W/2 - 22, 90, 1, 'center');
  hline(38+lw+28, 805, 71);
  hline(978, 1732-rw-28, 71);

  // badge
  ctx.font = `500 35px ${FONT_BODY}`;
  ctx.textAlign='left'; ctx.fillText(T.badge, 81, 447);

  // title: fit to 894px wide with letter spacing
  let ts = 80; ctx.font = `400 ${ts}px ${FONT_TITLE}`;
  const chars = [...T.title]; const n = Math.max(chars.length-1,1);
  let natural = spacedWidth(T.title, 0);
  let sp = (894 - natural)/n;
  if (sp < 4){ ts = Math.max(40, ts * (894 - 4*n)/natural); ctx.font = `400 ${ts}px ${FONT_TITLE}`; natural = spacedWidth(T.title,0); sp = Math.max(0,(894-natural)/n); }
  sp = Math.min(sp, 40);
  drawSpaced(T.title, 81, 556, sp, 'left');

  // value pills
  ctx.font = `400 23px ${FONT_BODY}`;
  let px = 84;
  T.values.split(',').map(s=>s.trim()).filter(Boolean).forEach(v=>{
    const w = ctx.measureText(v).width + 34;
    roundRect(px, 594, w, 34, 17);
    ctx.fillStyle='rgba(217,217,217,.04)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.3; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(v, px+17, 612);
    ctx.textBaseline='alphabetic';
    px += w + 13;
  });

  // name (script) fit into 780px
  let ns = 150; ctx.font = `400 ${ns}px ${FONT_SCRIPT}`;
  const nw = ctx.measureText(T.name).width;
  if (nw > 790){ ns = ns*790/nw; ctx.font = `400 ${ns}px ${FONT_SCRIPT}`; }
  ctx.fillText(T.name, 92, 748);
  hline(81, 846, 771, .9, 1.6);

  // description
  const size = 35, lh = 40;
  const lines = wrapRich(T.desc, 865, size);
  let y = 795 + 32;
  lines.slice(0,5).forEach(line=>{
    let x = 81;
    line.forEach(t=>{ ctx.font = `${t.bold?800:400} ${size}px ${FONT_BODY}`; ctx.fillText(t.w, x, y); x += t.tw; });
    y += lh;
  });

  // signer (bottom-right)
  ctx.textAlign='right';
  ctx.font = `500 30px ${FONT_BODY}`;
  const sl = T.signer.split('\n').filter(s=>s.trim()!=='');
  const rl = T.role.split('\n').filter(s=>s.trim()!=='');
  let sy = 1160 - (rl.length)*27 - 24 - (sl.length-1)*36;
  sl.forEach(s=>{ ctx.fillText(s.trim(), 1759, sy); sy += 36; });
  ctx.font = `400 23px ${FONT_BODY}`;
  sy += 2;
  rl.forEach(s=>{ ctx.fillText(s.trim(), 1759, sy); sy += 27; });
  ctx.textAlign='left';
}

/* ---------- UI wiring ---------- */
const themesEl = document.getElementById('themes');
function addThemeBtn(t, el){
  const b = document.createElement('button');
  b.className='theme'; b.dataset.id=t.id; b.title=t.t;
  b.innerHTML = `<img src="${t.thumb || themeSrc(t)}" alt="" loading="lazy">`;
  b.onclick = ()=>useTheme(t.id);
  el.appendChild(b);
}
THEMES.forEach(t=>addThemeBtn(t, themesEl));
async function loadFigma(){
  try{
    const list = await (await fetch('bg/figma/list.json')).json();
    FIGMA = list.map(([id, shade], i)=>({id, shade, figma:true, t:'№'+(i+1), src:`bg/figma/${id}.jpg`, thumb:`bg/figma/t/${id}.jpg`}));
    const el = document.getElementById('themesFig');
    FIGMA.forEach(t=>addThemeBtn(t, el));
  }catch(e){}
}

document.querySelectorAll('#gender button').forEach(b=>{
  b.classList.toggle('on', b.dataset.g===state.gender);
  b.onclick=()=>{ state.gender=b.dataset.g; store.set('gender',state.gender);
    document.querySelectorAll('#gender button').forEach(x=>x.classList.toggle('on',x===b)); refreshPrompt(); };
});

document.getElementById('copyPrompt').onclick = async ()=>{
  try{ await navigator.clipboard.writeText(promptEl.value); toast('Промпт көшірілді ✓'); }
  catch(e){ promptEl.select(); document.execCommand('copy'); toast('Промпт көшірілді ✓'); }
};
document.getElementById('openGemini').onclick = async ()=>{
  try{ await navigator.clipboard.writeText(promptEl.value); }catch(e){}
  window.open('https://gemini.google.com/app','_blank','noopener');
  toast('Промпт көшірілді — Gemini-де фото тіркеп, қойыңыз');
};

const fields = ['name','desc','badge','title','values','left','right','signer','role'];
fields.forEach(k=>{
  const el = document.getElementById('f_'+k);
  el.value = state.text[k];
  el.addEventListener('input', ()=>{ state.text[k]=el.value; store.set('text',state.text); draw(); });
});
document.getElementById('resetText').onclick = ()=>{
  state.text = {...DEFAULT_TEXT}; store.set('text',state.text);
  fields.forEach(k=>document.getElementById('f_'+k).value=state.text[k]); draw();
};

[['zoom','%'],['x',''],['y',''],['dark','%']].forEach(([k,u])=>{
  const r = document.getElementById('r_'+k), o = document.getElementById('o_'+k);
  r.value = state.adj[k]; o.textContent = r.value+u;
  r.addEventListener('input', ()=>{ state.adj[k]=+r.value; o.textContent=r.value+u; store.set('adj',state.adj); draw(); });
});

const fileEl = document.getElementById('file');
document.getElementById('uploadBtn').onclick = ()=>fileEl.click();
fileEl.onchange = ()=>{ useFile(fileEl.files[0]); fileEl.value=''; };
document.getElementById('resetBg').onclick = ()=>{
  state.adj = {zoom:100,x:0,y:0,dark:100}; store.set('adj',state.adj);
  ['zoom','x','y','dark'].forEach(k=>{ document.getElementById('r_'+k).value=state.adj[k]; document.getElementById('r_'+k).dispatchEvent(new Event('input')); });
  useTheme(state.theme);
};

const stage = document.getElementById('stage');
['dragenter','dragover'].forEach(e=>stage.addEventListener(e,ev=>{ev.preventDefault(); stage.classList.add('dragging');}));
['dragleave','drop'].forEach(e=>stage.addEventListener(e,ev=>{ev.preventDefault(); stage.classList.remove('dragging');}));
stage.addEventListener('drop', ev=>useFile(ev.dataTransfer.files[0]));
window.addEventListener('paste', ev=>{
  const item = [...(ev.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if (item){ ev.preventDefault(); useFile(item.getAsFile()); }
});

/* ---------- export ---------- */
function safeName(s){ return (s||'сертификат').replace(/[\\/:*?"<>|]+/g,'').trim() || 'сертификат'; }
function toBlob(type='image/png', q){ return new Promise((res,rej)=>{ try{ cv.toBlob(b=>b?res(b):rej(new Error('empty')), type, q); }catch(e){ rej(e); } }); }
function save(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
async function exportOne(type, ext){
  try{ const b = await toBlob(type, .95); save(b, `Сертификат - ${safeName(state.text.name)}.${ext}`); }
  catch(e){ toast('Жүктеу болмады: сайтты файл ретінде емес, сілтеме арқылы ашыңыз'); }
}
document.getElementById('dl').onclick = ()=>exportOne('image/png','png');
document.getElementById('dlJpg').onclick = ()=>exportOne('image/jpeg','jpg');

document.getElementById('batchBtn').onclick = async ()=>{
  const names = document.getElementById('batch').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const prog = document.getElementById('prog');
  if (!names.length){ toast('Алдымен аты-жөндерді жазыңыз'); return; }
  const keep = state.text.name;
  const zip = new JSZip();
  try{
    for (let i=0;i<names.length;i++){
      state.text.name = names[i]; draw();
      prog.textContent = `${i+1} / ${names.length} — ${names[i]}`;
      zip.file(`${String(i+1).padStart(2,'0')} - ${safeName(names[i])}.png`, await toBlob('image/png'));
    }
    prog.textContent = 'ZIP жиналып жатыр…';
    save(await zip.generateAsync({type:'blob'}), 'Сертификаттар.zip');
    prog.textContent = `Дайын: ${names.length} сертификат ✓`;
  }catch(e){ prog.textContent = 'Қате шықты: сайтты сілтеме арқылы ашыңыз'; }
  state.text.name = keep; draw();
};

/* ---------- toast ---------- */
let tt; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- boot ---------- */
(async ()=>{
  refreshPrompt();
  try{
    await Promise.all([
      document.fonts.load(`400 80px Michroma`), document.fonts.load(`400 150px "Great Vibes"`), document.fonts.load(`400 150px "Marck Script"`, "Аәғқңөұүһі"), document.fonts.load(`400 150px "Bad Script"`, "Аәғқңөұүһі"),
      document.fonts.load(`400 35px Montserrat`, 'әғқңөұүһі'), document.fonts.load(`500 35px Montserrat`, 'әғқңөұүһі'),
      document.fonts.load(`800 35px Montserrat`, 'әғқңөұүһі'),
    ]);
  }catch(e){}
  await loadFigma();
  await useTheme(state.theme);
  document.fonts.ready.then(draw);
})();
</script>
